<!DOCTYPE html>
<html lang="en">
<head>

<title>Open link?</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#fff;color:#111}
#start{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.box{width:min(420px,100%);text-align:center}
h1{font-size:32px;margin:0 0 10px}
p{font-size:18px;color:#555;margin:0 0 24px}
.actions{display:flex;gap:12px;justify-content:center}
button{font-size:18px;padding:13px 28px;border-radius:12px;border:1px solid #ccc;background:#f5f5f5;color:#111}
button:first-child{background:#111;color:#fff;border-color:#111}
#reveal{display:none;position:fixed;inset:0;background:#000;overflow:hidden}
#reveal img{width:100%;height:100%;object-fit:cover;display:block}
.message{position:absolute;top:28px;left:20px;right:20px;text-align:center;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.8)}
.message .big{font-size:34px;font-weight:800;line-height:1.05}
.message .small{font-size:18px;font-weight:600;line-height:1.3;margin-top:8px}
</style>
</head>
