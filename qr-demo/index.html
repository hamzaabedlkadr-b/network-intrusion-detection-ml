<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Open link?</title><link rel="preload" as="image" href="./monkey.png"><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:white;color:#111}
#start{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}.box{text-align:center}.box h1{font-size:28px;margin:0 0 24px;font-weight:600}.actions{display:flex;gap:12px;justify-content:center}
button{font-size:17px;padding:12px 28px;border-radius:10px;border:1px solid #d0d0d0;background:#fff;color:#111}button:first-child{background:#111;color:#fff;border-color:#111}
#reveal{display:none;position:fixed;inset:0;background:#000}#reveal img{width:100%;height:100%;object-fit:cover;display:block}
.msg{position:absolute;top:28px;left:18px;right:18px;color:#fff;text-align:center;text-shadow:0 2px 10px rgba(0,0,0,.85)}.big{font-size:34px;font-weight:800;line-height:1.05}.small{font-size:18px;font-weight:600;line-height:1.25;margin-top:10px}
</style></head><body>
<section id="start"><div class="box"><h1>Open this page?</h1><div class="actions"><button onclick="go()">Open</button><button onclick="go()">Cancel</button></div></div></section>
<section id="reveal"><img src="./monkey.png" fetchpriority="high" alt=""><div class="msg"><div class="big">YOU CLICKED IT ANYWAY.</div><div class="small">This link was harmless. The next random QR code might not be.</div></div></section>
<script>function go(){document.getElementById('start').style.display='none';document.getElementById('reveal').style.display='block'}</script></body></html>
